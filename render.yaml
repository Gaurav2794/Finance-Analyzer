services:
  # ── Backend FastAPI Web Service ─────────────────────────────────────────────
  - type: web
    name: finance-analyzer-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: finance-analyzer-storage
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DATABASE_URL
        fromDatabase:
          name: finance-analyzer-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: FRONTEND_URL
        value: "https://finance-analyzer-ui.onrender.com"
      - key: UPLOAD_DIR
        value: "/var/data/uploads"
      - key: OUTPUT_DIR
        value: "/var/data/outputs"

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: finance-analyzer-ui
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://finance-analyzer-api.onrender.com"

# ── Managed PostgreSQL Database ───────────────────────────────────────────────
databases:
  - name: finance-analyzer-db
    region: oregon
    plan: starter
    databaseName: finance_analyzer
    user: finance_admin
